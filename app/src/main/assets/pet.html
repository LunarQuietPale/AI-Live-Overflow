<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:transparent;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  #pet {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  #pet svg {
    width:100%; height:100%;
    animation: idle 3s ease-in-out infinite;
  }
  /* 待机呼吸动画 */
  @keyframes idle {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.02); }
  }
  /* 点击反应：跳一下 */
  .react { animation: react 0.6s ease !important; }
  @keyframes react {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-20px) scale(1.1); }
    60% { transform: translateY(0) scale(0.95); }
    100% { transform: translateY(0) scale(1); }
  }
  /* 双击反应：转圈+放大 */
  .doubleTap { animation: doubleTap 0.8s ease !important; }
  @keyframes doubleTap {
    0% { transform: translateY(0) scale(1) rotate(0deg); }
    25% { transform: translateY(-15px) scale(1.2) rotate(20deg); }
    50% { transform: translateY(-25px) scale(1.3) rotate(-20deg); }
    75% { transform: translateY(-10px) scale(1.15) rotate(10deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
  }
  /* 长按隐藏：缩小淡出 */
  .hide { animation: hide 0.5s ease forwards !important; }
  @keyframes hide {
    0% { transform: scale(1); opacity:1; }
    100% { transform: scale(0); opacity:0; }
  }
</style>
</head>
<body>
<div id="pet">
  <img id="petImg" src="whale.svg" alt="pet">
</div>
<script>
  var img = document.getElementById('petImg');
  // 清掉所有动画类
  function clearAnim() {
    img.classList.remove('react', 'doubleTap', 'hide');
    void img.offsetWidth;
  }
  // 点击随机反应
  window.petReact = function() {
    clearAnim();
    img.classList.add('react');
  };
  // 双击特殊动画
  window.petDoubleTap = function() {
    clearAnim();
    img.classList.add('doubleTap');
  };
  // 长按隐藏
  window.petHide = function() {
    clearAnim();
    img.classList.add('hide');
    // 隐藏后2秒恢复
    setTimeout(function() {
      img.classList.remove('hide');
    }, 2000);
  };
</script>
</body>
</html>
