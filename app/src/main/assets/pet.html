<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:transparent;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  #pet {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  #pet svg {
    width:90%; height:90%;
    animation: idle 3s ease-in-out infinite;
  }
  /* 待机呼吸动画 */
  @keyframes idle {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.02); }
  }
  /* 点击反应：跳一下 */
  .react { animation: react 0.6s ease !important; }
  @keyframes react {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-20px) scale(1.1); }
    60% { transform: translateY(0) scale(0.95); }
    100% { transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>
<div id="pet">
  <img id="petImg" src="whale.svg" alt="pet">
</div>
<script>
  var img = document.getElementById('petImg');
  // 点击随机反应
  window.petReact = function() {
    img.classList.remove('react');
    void img.offsetWidth; // 重置动画
    img.classList.add('react');
  };
</script>
</body>
</html>
