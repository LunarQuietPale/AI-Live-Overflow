<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:transparent;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  #pet {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    position:relative;   /* 修复气泡定位：让#bubble相对#pet定位 */
  }
  #pet svg {
    width:100%; height:100%;
    animation: idle 3s ease-in-out infinite;
  }
  .petWrap {
    position:relative;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  #petImg {
    width:100%; height:100%;
    object-fit:contain;
    display:block;
    animation: idle 3s ease-in-out infinite;
  }
  /* 金币独立图层：覆盖在petImg上，做弹出动画 */
  #coinWrap {
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    opacity:0;
    animation: idle 3s ease-in-out infinite;  /* 与petImg同步呼吸浮动，避免错位 */
  }
  #coinWrap.show { opacity:1; }
  #coinImg {
    width:100%; height:100%;
    object-fit:contain;
    display:block;
  }
  /* 金币弹出动画：从藏在钱包里(translateY 0)斜向上冒出到最终位置 */
  #coinWrap.pop #coinImg { animation: coinPop 0.5s ease forwards; }
  @keyframes coinPop {
    0%   { transform: translate(0, 0); }
    100% { transform: translate(-2px, -8px); }
  }
  /* 待机呼吸动画 */
  @keyframes idle {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.02); }
  }
  /* 点击反应：跳一下 */
  .react { animation: react 0.6s ease !important; }
  @keyframes react {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-20px) scale(1.1); }
    60% { transform: translateY(0) scale(0.95); }
    100% { transform: translateY(0) scale(1); }
  }
  /* 连戳升级：抖 */
  .shake { animation: shake 0.4s ease !important; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-8px) rotate(-8deg); }
    40% { transform: translateX(8px) rotate(8deg); }
    60% { transform: translateX(-6px) rotate(-6deg); }
    80% { transform: translateX(6px) rotate(6deg); }
  }
  /* 连戳升级：转 */
  .spin { animation: spin 0.5s ease !important; }
  @keyframes spin {
    0% { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(360deg) scale(1); }
  }
  /* 生气：鼓起来变红 */
  .angry { animation: angry 0.5s ease !important; }
  @keyframes angry {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(1.15); }
  }
  .angryFilter { filter: sepia(1) hue-rotate(-50deg) saturate(6) brightness(0.9); }
  /* 生气气泡 */
  #bubble {
    position:absolute;
    top:auto; bottom:6px; left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.85);
    color:#7ec8e3;
    font-size:11px;
    font-weight:bold;
    padding:3px 8px;
    border-radius:10px;
    white-space:normal;
    max-width:92%;
    max-height:2.4em;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s;
    font-family:sans-serif;
    z-index:10;
    box-shadow:0 1px 4px rgba(0,0,0,0.15);
  }
  #bubble.show { opacity:1; }
  /* 双击反应：转圈+放大 */
  .doubleTap { animation: doubleTap 0.8s ease !important; }
  @keyframes doubleTap {
    0% { transform: translateY(0) scale(1) rotate(0deg); }
    25% { transform: translateY(-15px) scale(1.2) rotate(20deg); }
    50% { transform: translateY(-25px) scale(1.3) rotate(-20deg); }
    75% { transform: translateY(-10px) scale(1.15) rotate(10deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
  }
  /* 长按隐藏：缩小淡出 */
  .hide { animation: hide 0.5s ease forwards !important; }
  @keyframes hide {
    0% { transform: scale(1); opacity:1; }
    100% { transform: scale(0); opacity:0; }
  }
  /* 甩动：甩出去（飞+落地弹跳） */
  .fling { animation: fling 0.8s cubic-bezier(.3,.7,.4,1) forwards !important; }
  @keyframes fling {
    0% { transform: translate(0,0) scale(1) rotate(0); }
    40% { transform: translate(var(--fx), var(--fy)) scale(0.9) rotate(var(--fr)); }
    55% { transform: translate(var(--fx), calc(var(--fy) + 12px)) scale(0.85) rotate(var(--fr)); }
    70% { transform: translate(var(--fx), var(--fy)) scale(0.9) rotate(var(--fr)); }
    85% { transform: translate(var(--fx), calc(var(--fy) + 8px)) scale(0.88) rotate(var(--fr)); }
    100% { transform: translate(var(--fx), var(--fy)) scale(0.9) rotate(var(--fr)); }
  }
  /* 甩动：扭着游回来（S形） */
  .swim { animation: swim 1.6s ease-in-out forwards !important; }
  @keyframes swim {
    0% { transform: translate(var(--fx), var(--fy)) scale(0.9) rotate(var(--fr)); }
    15% { transform: translate(calc(var(--fx)*0.7), calc(var(--fy)*0.7 - 10px)) scale(0.92) rotate(calc(var(--fr) - 15deg)); }
    30% { transform: translate(calc(var(--fx)*0.4), calc(var(--fy)*0.4 + 10px)) scale(0.94) rotate(calc(var(--fr) + 15deg)); }
    45% { transform: translate(calc(var(--fx)*0.15), calc(var(--fy)*0.15 - 10px)) scale(0.96) rotate(calc(var(--fr) - 10deg)); }
    60% { transform: translate(0, 8px) scale(0.98) rotate(10deg); }
    75% { transform: translate(0, -6px) scale(1) rotate(-8deg); }
    90% { transform: translate(0, 3px) scale(1) rotate(5deg); }
    100% { transform: translate(0,0) scale(1) rotate(0); }
  }
  /* 感知：开心跳 */
  .happy { animation: happy 0.8s ease !important; }
  @keyframes happy {
    0% { transform: translateY(0) scale(1); }
    20% { transform: translateY(-18px) scale(1.15) rotate(-8deg); }
    40% { transform: translateY(-10px) scale(1.1) rotate(8deg); }
    60% { transform: translateY(-14px) scale(1.12) rotate(-5deg); }
    80% { transform: translateY(-5px) scale(1.05) rotate(3deg); }
    100% { transform: translateY(0) scale(1); }
  }
  /* 感知：惊讶 */
  .surprise { animation: surprise 0.5s ease !important; }
  @keyframes surprise {
    0% { transform: scale(1); }
    30% { transform: scale(1.3); }
    60% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }
  /* 感知：困倦（打哈欠） */
  .sleepy { animation: sleepy 1.2s ease !important; }
  @keyframes sleepy {
    0% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-6px) scale(1.05) rotate(-4deg); }
    50% { transform: translateY(0) scale(1); }
    75% { transform: translateY(-6px) scale(1.05) rotate(4deg); }
    100% { transform: translateY(0) scale(1); }
  }
  /* 唤醒过渡：伸懒腰（从睡眠切到任何状态先播这个） */
  .wake { animation: wake 0.9s ease !important; }
  @keyframes wake {
    0% { transform: translateY(0) scale(1) rotate(0); }
    20% { transform: translateY(-10px) scale(1.1) rotate(-10deg); }
    40% { transform: translateY(-18px) scale(1.15) rotate(10deg); }
    60% { transform: translateY(-12px) scale(1.12) rotate(-6deg); }
    80% { transform: translateY(-6px) scale(1.06) rotate(4deg); }
    100% { transform: translateY(0) scale(1) rotate(0); }
  }
  /* 睡眠：头顶💤打呼吹泡泡（持续循环，与闭眼同步） */
  #zzz {
    position:absolute;
    top:4%; left:50%;
    transform:translateX(-50%);
    pointer-events:none;
    z-index:20;
    opacity:0;
  }
  #zzz.show { opacity:1; }
  #zzz .zz {
    position:absolute;
    font-size:42px;
    line-height:1;
    opacity:0;
    /* 加描边+阴影，从海背景里突出 */
    -webkit-text-stroke: 2px rgba(255,255,255,0.9);
    text-shadow: 0 2px 6px rgba(0,0,0,0.45), 0 0 12px rgba(255,255,255,0.5);
  }
  #zzz.show .zz { animation: zzzFloat 3.2s ease-out infinite; }
  #zzz .zz:nth-child(1) { animation-delay:0s; left:-20px; }
  #zzz .zz:nth-child(2) { animation-delay:1.1s; left:12px; font-size:32px; }
  #zzz .zz:nth-child(3) { animation-delay:2.2s; left:-34px; font-size:26px; }
  @keyframes zzzFloat {
    0%   { transform: translate(0, 0) scale(0.5); opacity:0; }
    15%  { opacity:1; }
    60%  { opacity:1; }
    100% { transform: translate(40px, -90px) scale(1.6); opacity:0; }
  }
</style>
</head>
<body>
<div id="pet">
  <div class="petWrap">
    <img id="petImg" src="whale.svg" alt="pet">
    <div id="coinWrap"><img id="coinImg" src="whale_coin.svg" alt="coin"></div>
    <div id="zzz"><span class="zz">💤</span><span class="zz">💤</span><span class="zz">💤</span></div>
  </div>
  <div id="bubble">哼！</div>
</div>
<script>
  var img = document.getElementById('petImg');
  var bubble = document.getElementById('bubble');
  var zzz = document.getElementById('zzz');
  var coinWrap = document.getElementById('coinWrap');
  var coinPopTimer = null;  // 金币弹出动画定时器
  // 清掉所有动画类
  function clearAnim() {
    img.classList.remove('react', 'shake', 'spin', 'angry', 'doubleTap', 'hide', 'fling', 'swim', 'happy', 'surprise', 'sleepy', 'wake', 'angryFilter');
    // 强制重启待机呼吸动画，避免动作/睡眠后 idle 浮动丢失
    img.style.animation = 'none';
    void img.offsetWidth;
    img.style.animation = '';
  }
  // 动画播完自动清类，恢复待机浮动（idle是infinite不触发animationend，动作动画播完触发）
  // 生气霸屏/睡眠时跳过：生气让angryTimer处理3秒霸屏，睡眠靠isSleeping+闭眼SVG维持
  img.addEventListener('animationend', function() {
    if (!isAngry && !isSleeping) clearAnim();
  });
// ---- 连戳递进（生气） ----
  var tapCount = 0;       // 连戳计数
  var lastTapTime = 0;    // 上次戳的时间
  var angryTimer = null;  // 消气定时器
  var isAngry = false;    // 生气霸屏标志
  var animLock = false;   // 动画锁：动画播放期间只计数不升级
  var pendingLevel = 0;   // 动画锁期间累计的升级需求

  // ---- 表达系统：自言自语 ----
  var idleLines = [
    '今天也要元气满满~',
    '主人怎么还不理我呀',
    '我游啊游~',
    '好想出去玩~',
    '今天天气不错呢',
    '主人加油！',
    '咕噜咕噜~',
    '我在发呆呢',
    '要不要摸摸我~',
    '好安静呀'
  ];
  function startIdleChatter() {
    function schedule() {
      if (isAngry) { setTimeout(schedule, 5000); return; }
      var delay = 30000 + Math.random() * 60000;  // 30-90秒随机
      setTimeout(function() {
        if (!isAngry) {
          var line = idleLines[Math.floor(Math.random() * idleLines.length)];
          showBubble(line);
        }
        schedule();
      }, delay);
    }
    schedule();
  }

  // 统一连戳计数入口（Kotlin每次点击都调这里）
  window.petTap = function() {
    if (touch()) return;  // 睡眠唤醒：先播wake动画，本次点击只唤醒
    var now = Date.now();
    // 连戳判定窗口：1000ms（符合正常人连续戳的节奏）
    if (now - lastTapTime < 1000) {
      tapCount++;
    } else {
      tapCount = 1;
    }
    lastTapTime = now;
    // 生气期间不升级，只保持计数
    if (isAngry) return;
    // 动画锁：动画播放期间只计数，等播完再升级
    if (animLock) {
      pendingLevel = tapCount;
      return;
    }
    doUpgrade();
  };

  // 执行升级（跳->抖->转->生气）
  function doUpgrade() {
    clearAnim();
    img.classList.remove('angryFilter');
    bubble.classList.remove('show');
    if (tapCount >= 6) {
      // 生气：鼓起来变红 + 气泡（霸屏）
      isAngry = true;
      img.classList.add('angry', 'angryFilter');
      showBubble('哼！');
      if (angryTimer) clearTimeout(angryTimer);
      angryTimer = setTimeout(function() {
        img.classList.remove('angry', 'angryFilter');
        bubble.classList.remove('show');
        isAngry = false;
        tapCount = 0;
        pendingLevel = 0;
      }, 3000);
      // 兜底：防止angryTimer的setTimeout未执行导致isAngry卡死
      setTimeout(function() {
        if (isAngry) {
          img.classList.remove('angry', 'angryFilter');
          bubble.classList.remove('show');
          isAngry = false;
          tapCount = 0;
          pendingLevel = 0;
        }
      }, 3500);
      return;
    }
    var level = tapCount;
    var animClass, animMs;
    if (level >= 5) {
      animClass = 'spin'; animMs = 500;
    } else if (level >= 3) {
      animClass = 'shake'; animMs = 400;
    } else {
      animClass = 'react'; animMs = 600;
    }
    img.classList.add(animClass);
    // 动画锁：动画期间只计数不升级，播完再处理累计
    animLock = true;
    setTimeout(function() {
      animLock = false;
      // 动画期间又戳了，继续升级
      if (pendingLevel > level) {
        var p = pendingLevel;
        pendingLevel = 0;
        tapCount = p;
        doUpgrade();
      } else {
        pendingLevel = 0;
      }
    }, animMs);
    // 兜底：防止animLock卡死（动画锁最多1.5秒必释放）
    setTimeout(function() {
      if (animLock) {
        animLock = false;
        if (pendingLevel > 0) {
          var p = pendingLevel;
          pendingLevel = 0;
          tapCount = p;
          doUpgrade();
        }
      }
    }, 1500);
  }

  // 单击反应（走petTap统一计数升级，不再单独处理）
  window.petReact = function() {
    if (isAngry) return;  // 生气霸屏
    // 单击就是一次戳，交给petTap处理
    window.petTap();
  };
  // 双击特殊动画
  window.petDoubleTap = function() {
    if (isAngry) return;  // 生气霸屏
    if (touch()) return;  // 睡眠唤醒
    clearAnim();
    img.classList.remove('angryFilter');
    bubble.classList.remove('show');
    img.classList.add('doubleTap');
  };
  // 长按隐藏
  window.petHide = function() {
    if (isAngry) return;  // 生气霸屏
    if (touch()) return;  // 睡眠唤醒
    clearAnim();
    img.classList.remove('angryFilter');
    bubble.classList.remove('show');
    img.classList.add('hide');
    setTimeout(function() {
      img.classList.remove('hide');
    }, 2000);
  };
  // ---- 甩动（Fling） ----
  window.petFling = function(dx, dy) {
    if (isAngry) return;  // 生气霸屏
    if (touch()) return;  // 睡眠唤醒
    clearAnim();
    img.classList.remove('angryFilter');
    bubble.classList.remove('show');
    // 甩出去的距离（限制在窗口内）
    var fx = Math.max(-80, Math.min(80, dx));
    var fy = Math.max(-80, Math.min(80, dy));
    // 甩的方向决定旋转
    var fr = dx > 0 ? 40 : -40;
    img.style.setProperty('--fx', fx + 'px');
    img.style.setProperty('--fy', fy + 'px');
    img.style.setProperty('--fr', fr + 'deg');
    // 先甩出去，落地后游回来
    img.classList.add('fling');
    setTimeout(function() {
      img.classList.remove('fling');
      void img.offsetWidth;
      img.classList.add('swim');
      setTimeout(function() {
        img.classList.remove('swim');
        img.style.removeProperty('--fx');
        img.style.removeProperty('--fy');
        img.style.removeProperty('--fr');
      }, 1600);
    }, 800);
  };

  // ---- 感知系统（前台App/截图/充电/时段） ----
  var senseTimer = null;
  // 显示气泡文字（通过独立悬浮窗，不受浮窗尺寸限制）
  function showBubble(text, ms) {
    if (window.Android && window.Android.showBubble) {
      window.Android.showBubble(text);
    }
  }
  // 感知统一入口
  window.petSense = function(type, data) {
    if (isAngry) return;  // 生气霸屏，感知也先让路
    clearAnim();
    img.classList.remove('angryFilter');
    switch (type) {
      case 'charge':
        // 充电：开心跳
        img.classList.add('happy');
        showBubble('充电中~ 好开心！');
        break;
      case 'lowbattery':
        // 低电量：惊讶
        img.classList.add('surprise');
        showBubble('快没电啦！快充我！');
        break;
      case 'screenshot':
        // 截图：惊讶
        img.classList.add('surprise');
        showBubble('咔嚓！拍到我啦~');
        break;
      case 'time':
        // 时段感知
        var h = data;
        if (h >= 5 && h < 9) {
          img.classList.add('happy');
          showBubble('早安~ 新的一天！');
        } else if (h >= 9 && h < 12) {
          img.classList.add('happy');
          showBubble('上午好呀~');
        } else if (h >= 12 && h < 14) {
          img.classList.add('happy');
          showBubble('午安~ 该吃饭啦');
        } else if (h >= 14 && h < 18) {
          img.classList.add('happy');
          showBubble('下午好~ 加油！');
        } else if (h >= 18 && h < 22) {
          img.classList.add('happy');
          showBubble('晚上好~');
        } else if (h >= 22 || h < 5) {
          img.classList.add('sleepy');
          showBubble('夜深了，该睡啦~');
        }
        break;
      case 'app':
        // 前台App切换（data为包名），基础版先提示，App反应映射后续扩展
        var pkg = data;
        var appName = window.appNames && window.appNames[pkg] ? window.appNames[pkg] : pkg;
        // 桌面/启动器不提示，避免频繁刷（精确匹配已知launcher包名，避免误伤含home的app如作业帮com.baidu.homework）
        var launchers = ['com.android.launcher','com.android.launcher3','com.miui.home','com.oppo.launcher','com.sec.android.app.launcher','com.huawei.android.launcher','com.bbk.launcher2','com.coloros.launcher','com.vivo.launcher','com.smartisanos.launcher','com.meizu.flyme.launcher'];
        // 拼多多：切换钱包+金币配件（whale_wallet.svg），金币独立层做弹出动画，切走时切回默认（含切回桌面launcher）
        if (pkg === 'com.xunmeng.pinduoduo') {
          if (img.src.indexOf('whale_wallet.svg') < 0) img.src = 'whale_wallet.svg';
          // 显示金币层（起始位置藏在钱包里）
          coinWrap.classList.add('show');
          coinWrap.classList.remove('pop');
          // 0.5s后金币弹出动画（斜向上冒出到最终位置）
          if (coinPopTimer) clearTimeout(coinPopTimer);
          coinPopTimer = setTimeout(function() {
            coinWrap.classList.add('pop');
          }, 500);
        } else {
          // 切走：隐藏金币层、清弹出动画、切回默认鲸鱼
          if (coinPopTimer) { clearTimeout(coinPopTimer); coinPopTimer = null; }
          coinWrap.classList.remove('pop');
          coinWrap.classList.remove('show');
          if (img.src.indexOf('whale_wallet.svg') >= 0) img.src = 'whale.svg';
        }
        if (launchers.indexOf(pkg) >= 0) break;
        img.classList.add('surprise');
        // 拼多多气泡：从开始持续到动画结束（约4.5s）
        if (pkg === 'com.xunmeng.pinduoduo') {
          showBubble('切到拼多多啦~让我审批一下', 4500);
        } else {
          showBubble('切到 ' + appName + ' 啦~');
        }
        break;
    }
  };
  // 情绪引擎：Supabase轮询触发（由Kotlin侧调用）
  window.petEmotion = function(emotion, intensity) {
    if (isAngry) return;  // 生气霸屏优先
    clearAnim();
    img.classList.remove('angryFilter');
    switch (emotion) {
      case 'happy':
        img.classList.add('happy');
        showBubble('好开心呀~');
        break;
      case 'sad':
        img.classList.add('sleepy');
        showBubble('有点难过呢...');
        break;
      case 'angry':
        img.classList.add('angry');
        img.classList.add('angryFilter');
        showBubble('哼！我不开心！');
        break;
      case 'tired':
        img.classList.add('sleepy');
        showBubble('好累呀...想睡觉');
        break;
      case 'excited':
        img.classList.add('happy');
        showBubble('哇！好兴奋！');
        break;
      default:  // neutral
        showBubble('主人，我在呢~');
        break;
    }
  };

  // ---- 睡眠检测 + 唤醒过渡 ----
  var lastInteractTime = Date.now();  // 最后互动时间
  var isSleeping = false;             // 是否睡眠
  var sleepCheckTimer = null;
  // 互动时更新最后互动时间，若在睡眠则先播唤醒动画
  function touch() {
    lastInteractTime = Date.now();
    if (isSleeping) {
      isSleeping = false;
      clearAnim();
      img.classList.remove('angryFilter');
      bubble.classList.remove('show');
      zzz.classList.remove('show');
      img.src = 'whale.svg';  // 唤醒切回睁眼
      img.classList.add('wake');
      showBubble('唔...我醒了~');
      // 播完唤醒动画后再继续，这里直接返回，由调用方再触发实际反应
      return true;  // 表示刚被唤醒
    }
    return false;
  }
  // 睡眠检测：每30秒检查，超过15分钟无互动进入睡眠
  function startSleepCheck() {
    function check() {
      if (!isAngry && !isSleeping && Date.now() - lastInteractTime > 15 * 60 * 1000) {
        isSleeping = true;
        clearAnim();
        img.classList.remove('angryFilter');
        bubble.classList.remove('show');
        img.src = 'whale_sleep.svg';  // 睡眠切换闭眼
        img.classList.add('sleepy');
        zzz.classList.add('show');     // 头顶💤打呼吹泡泡
      }
      sleepCheckTimer = setTimeout(check, 30 * 1000);
    }
    check();
  }
  // ---- 20分钟定时行为 ----
  function startTimedBehavior() {
    function schedule() {
      setTimeout(function() {
        if (!isAngry && !isSleeping) {
          // 30% 概率触发
          if (Math.random() < 0.3) {
            var h = new Date().getHours();
            clearAnim();
            img.classList.remove('angryFilter');
            bubble.classList.remove('show');
            if (h >= 22 || h < 5) {
              img.classList.add('sleepy');
              showBubble('夜深了，我有点困了~');
            } else if (h >= 5 && h < 9) {
              img.classList.add('happy');
              showBubble('早起的鲸鱼有鱼吃~');
            } else if (h >= 12 && h < 14) {
              img.classList.add('happy');
              showBubble('午休时间到，主人也歇会儿吧~');
            } else {
              var acts = ['happy','surprise','sleepy'];
              var a = acts[Math.floor(Math.random()*acts.length)];
              img.classList.add(a);
              var msgs = {'happy':'嘿嘿，我心情不错~','surprise':'咦？刚想到主人~','sleepy':'有点犯困了...'};
              showBubble(msgs[a]);
            }
          }
        }
        schedule();
      }, 20 * 60 * 1000);
    }
    schedule();
  }
  // 启动表达系统：自言自语
  startIdleChatter();
  // 启动睡眠检测
  startSleepCheck();
  // 启动20分钟定时行为
  startTimedBehavior();
</script>
